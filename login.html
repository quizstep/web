<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | QuizStep</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Topbar -->
    <header class="topbar">
        <div class="logo-section">
            <img src="images/logo-icon.png" alt="QuizStep Logo" class="brand-logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 36 36\'><rect width=\'36\' height=\'36\' rx=\'6\' fill=\'%230056b3\'/><text x=\'50%25\' y=\'55%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-family=\'sans-serif\' font-size=\'16\' font-weight=\'bold\'>Q</text></svg>';">
            <span class="brand-name">QuizStep</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme" title="Toggle theme"></button>
        </nav>
    </header>

    <!-- Main Content: Login Form Card -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to QuizStep</p>
            </div>

            <!-- Error / Status Message Alert Area -->
            <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite"></div>

            <form id="login-form" class="auth-form" novalidate>
                <!-- Email or Phone Input -->
                <div class="form-group">
                    <label for="login-identifier" class="form-label">Email or Phone</label>
                    <input 
                        type="text" 
                        id="login-identifier" 
                        name="login-identifier" 
                        class="form-input" 
                        placeholder="Email or phone" 
                        autocomplete="username" 
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Password" 
                            autocomplete="current-password" 
                            required
                        >
                        <button 
                            type="button" 
                            class="btn-toggle-password" 
                            aria-label="Show password"
                            title="Show password"
                        >
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <div class="auth-links-row">
                    <a href="#" id="forgot-password-link" class="auth-link">Forgot password?</a>
                </div>

                <!-- Submit Button with Loading State -->
                <button type="submit" class="btn-primary auth-btn" id="submit-btn">
                    <span class="btn-text">Log In</span>
                    <span class="btn-spinner" hidden aria-hidden="true"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html" class="auth-link">Register</a></p>
            </div>
        </div>

        <div class="back-home-wrap">
            <a href="index.html" class="back-home-link">← Back to Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 QuizStep. All rights reserved.</p>
    </footer>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config & Auth Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
