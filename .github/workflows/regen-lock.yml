name: Regen Lockfile
on: workflow_dispatch
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rm -f package-lock.json
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
